[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soulscript-loop"
version = "0.2.0"
description = "A continuously running perceptual field for one AI persona — senses it can't author, predictions that can break, attention that can be pulled, and a budget it can run out of."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only OR LicenseRef-OrionForge-Commercial" }
authors = [{ name = "Trent Hunter (DrTHunter)" }]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=7"]
embeddings = ["sentence-transformers>=2.2"]

[project.urls]
Homepage = "https://orionforge.chat"
"SoulScript Engine" = "https://github.com/DrTHunter/SoulScript-Engine"

[tool.setuptools]
packages = ["soulscript_loop"]
